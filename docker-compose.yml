services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: indicator_map
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องตั้ง POSTGRES_PASSWORD ในไฟล์ .env ที่ root}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # For pgAdmin/psql on this machine only. 127.0.0.1 keeps it off the network and out of
    # the tunnel; on a VPS, reach it through an SSH tunnel instead of opening it publicly.
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d indicator_map']
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once per `docker compose up`: creates tables on an empty database, applies the
  # seed (idempotent) and creates the admin account if it doesn't exist yet, then exits.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ['node', 'src/migrate.js']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/indicator_map
      JWT_SECRET: ${JWT_SECRET:?ต้องตั้ง JWT_SECRET ในไฟล์ .env ที่ root}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/indicator_map
      JWT_SECRET: ${JWT_SECRET:?ต้องตั้ง JWT_SECRET ในไฟล์ .env ที่ root}
      JWT_TTL: ${JWT_TTL:-12h}
      UPLOAD_DIR: /app/backend/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      # The browser reaches the API through `web` on the same origin, so CORS isn't used.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - uploads:/app/backend/uploads
    # No published port: only `web` (nginx) talks to the API, over Docker's private network.

  # The only service reachable from outside: built frontend + /api proxy.
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  pgdata:
  uploads:
