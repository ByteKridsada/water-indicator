# One public entry point: serves the built frontend and forwards /api to the backend,
# so the browser only ever talks to a single origin (no CORS, one address to publish).
server {
    listen 80;
    server_name _;

    # Uploads are capped at 5 MB by the API (MAX_UPLOAD_BYTES); nginx's default is 1 MB.
    client_max_body_size 6m;

    # Requests arrive through a tunnel or proxy on a private network. Trust the client
    # address those proxies report, but only when the request comes from a private range,
    # so a visitor on the internet can't fake their IP to dodge the login rate limit.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        # Pass exactly one address so the API (trust proxy = 1) sees the real client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in these filenames, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html must never be cached, or browsers keep loading old asset names after an update.
    location = /index.html {
        expires -1;
    }

    # Client-side routes such as /map or /locations/5/edit are handled by React Router.
    location / {
        try_files $uri /index.html;
    }
}
